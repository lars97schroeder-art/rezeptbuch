<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Schrödamskis Schlemmerliste</title>
<meta name="theme-color" content="#e8590c">
<link rel="manifest" href="manifest.webmanifest?v=20260707">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Schlemmerliste">
<link rel="stylesheet" href="style.css?v=20260706-2007">
<script>
// Version-Check: entfernt kaputte oder uralte Rezeptdaten VOR app.js.
// WICHTIG: NIEMALS localStorage.clear() — das würde den GitHub-Token und
// die Wochenplan-Einträge mitlöschen. Nur gezielt rezeptbuch-data anfassen.
console.log('🔍 Version-Check startet...');
if (typeof localStorage !== 'undefined') {
  try {
    const stored = localStorage.getItem('rezeptbuch-data');
    if (stored) {
      try {
        const data = JSON.parse(stored);
        const localVer = parseFloat(data.version);
        if (localVer < 3.3) {
          console.warn('⚠️ Alte Datenversion erkannt:', localVer, '– Rezeptdaten werden neu geladen');
          localStorage.removeItem('rezeptbuch-data');
        }
      } catch (parseErr) {
        console.error('❌ Rezeptdaten defekt – werden neu geladen:', parseErr);
        localStorage.removeItem('rezeptbuch-data');
      }
    }
  } catch (e) {
    console.error('❌ Version-Check fehlgeschlagen (Storage nicht verfügbar?):', e);
  }
}
console.log('✅ Version-Check abgeschlossen');
</script>
</head>
<body>
<!-- Schmale Zone am linken Rand: touch-action:none verhindert, dass Safari
     den Wisch als eigene Vor/Zurück-Browsergeste erkennt, bevor unser
     Wisch-Handler (nach rechts = Einstellungen bzw. Zurück) greift. -->
<div id="edge-swipe-guard" aria-hidden="true"></div>
<header>
  <div class="topbar">
    <h1>
      <span class="h1-text">Schrödamskis Schlemmerliste</span>
      <span class="h1-emoji">👨🏻‍🍳👩🏼‍🍳</span>
    </h1>
    <div class="actions">
      <button id="mode-btn" aria-label="Bereich wechseln" class="btn-tinder-primary"></button>
      <button id="btn-settings" title="Einstellungen" aria-label="Einstellungen" class="btn-tinder-primary">☰</button>
    </div>
  </div>
  <div id="mode-menu" hidden></div>
  <div class="shortcuts-row" id="shortcuts-row">
    <button id="btn-weekplan" title="Wochenplan" aria-label="Wochenplan" class="weekplan-shortcut">
      <svg class="weekplan-shortcut-bg" viewBox="0 0 100 100" aria-hidden="true">
        <rect x="10" y="18" width="80" height="72" rx="10" fill="none" stroke="currentColor" stroke-width="5"/>
        <line x1="10" y1="38" x2="90" y2="38" stroke="currentColor" stroke-width="5"/>
        <line x1="28" y1="8" x2="28" y2="26" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
        <line x1="72" y1="8" x2="72" y2="26" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
        <circle cx="28" cy="55" r="5" fill="currentColor"/>
        <circle cx="50" cy="55" r="5" fill="currentColor"/>
        <circle cx="72" cy="55" r="5" fill="currentColor"/>
        <circle cx="28" cy="74" r="5" fill="currentColor"/>
        <circle cx="50" cy="74" r="5" fill="currentColor"/>
      </svg>
      <span class="weekplan-shortcut-label">📅 Wochenplan</span>
    </button>
    <button id="btn-tinder" title="Rezept-Tinder" aria-label="Rezept-Tinder" class="weekplan-shortcut">
      <svg class="weekplan-shortcut-bg" viewBox="0 0 100 100" aria-hidden="true">
        <path d="M50 6 C34 26 24 40 24 60 C24 80 36 92 50 92 C64 92 76 80 76 60 C76 48 70 39 63 33 C65 46 58 51 53 47 C56 36 50 20 50 6 Z" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
      </svg>
      <span class="weekplan-shortcut-label">🔥 Food Match</span>
    </button>
  </div>
  <div class="search-wrapper">
    <input id="search" type="search" placeholder="Rezept oder Zutat suchen …" autocomplete="off">
    <button id="search-clear" class="search-clear" aria-label="Suche löschen" hidden>✕</button>
  </div>
  <div class="chips-row">
    <nav id="chips" aria-label="Kategorien"></nav>
    <div class="sort-wrap">
      <button id="sort-btn" aria-label="Sortieren" title="Sortieren">↕</button>
      <div id="sort-menu" hidden></div>
    </div>
  </div>
</header>

<main id="grid"></main>
<p id="status"></p>

<div id="detail" hidden></div>
<div id="editor" hidden></div>
<div id="toast" hidden></div>

<script src="editor.js?v=20260706-2007"></script>
<script>
// Cache-Buster: app.js wird IMMER neu vom Server geladen, nie vom Cache
// Das ist KRITISCH für Updates - ohne das bleiben alte Versionen gecacht
const cacheBuster = '?t=' + Date.now() + '&v=' + Math.random();
const script = document.createElement('script');
script.src = 'app.js' + cacheBuster;
document.body.appendChild(script);
</script>
</body>
</html>
