<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Schrödamskis Schlemmerliste</title>
<meta name="theme-color" content="#e8590c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Schlemmerliste">
<link rel="stylesheet" href="style.css">
<script>
// KRITISCHER version-check: Alte v3.1 muss raus!
// Dieses Script läuft VOR app.js und löscht alte Daten
console.log('🔍 Version-Check startet...');
if (typeof localStorage !== 'undefined') {
  try {
    const stored = localStorage.getItem('rezeptbuch-data');
    console.log('📦 LocalStorage rezeptbuch-data:', stored ? '✓ vorhanden' : '✗ leer');

    if (stored) {
      try {
        const data = JSON.parse(stored);
        const version = data.version;
        console.log('📌 Lokale Version:', version);

        // WICHTIG: Numerischer Vergleich, nicht String-Vergleich
        const localVer = parseFloat(version);
        const requiredVer = 3.3;

        if (localVer < requiredVer) {
          console.warn('⚠️ ALTE VERSION ERKANNT:', localVer, '< erforderlich', requiredVer);
          console.log('🗑️ Lösche localStorage + sessionStorage...');
          localStorage.clear();
          sessionStorage.clear();
          console.log('✅ Storage gelöscht - neue Version wird geladen');
        } else {
          console.log('✅ Version ist aktuell:', localVer);
        }
      } catch (parseErr) {
        console.error('❌ JSON Parse Fehler:', parseErr);
        console.log('🗑️ Lösche wegen Parse-Fehler...');
        localStorage.clear();
        sessionStorage.clear();
      }
    } else {
      console.log('ℹ️ Storage ist leer - neue Installation oder gerade gelöscht');
    }
  } catch (e) {
    console.error('❌ Kritischer Fehler im version-check:', e);
    console.log('🗑️ Sicherheitshalber alles löschen...');
    try {
      localStorage.clear();
      sessionStorage.clear();
    } catch (clearErr) {
      console.error('❌ Konnte Storage nicht löschen:', clearErr);
    }
  }
}
console.log('✅ Version-Check abgeschlossen\n');
</script>
</head>
<body>
<header>
  <div class="topbar">
    <button id="mode-btn" aria-label="Bereich wechseln">
      <h1>Schrödamskis Schlemmerliste 👨🏻‍🍳👩🏼‍🍳</h1>
      <span id="mode-label"></span>
    </button>
    <div class="actions">
      <button id="btn-weekplan" title="Wochenplan" aria-label="Wochenplan" class="btn-tinder-primary">📅</button>
      <button id="btn-tinder" title="Rezept-Tinder" aria-label="Rezept-Tinder" class="btn-tinder-primary">🔥</button>
      <button id="btn-settings" title="Einstellungen" aria-label="Einstellungen" class="btn-tinder-primary">⚙️</button>
    </div>
  </div>
  <div id="mode-menu" hidden></div>
  <div class="search-wrapper">
    <input id="search" type="search" placeholder="Rezept oder Zutat suchen …" autocomplete="off">
    <button id="search-clear" class="search-clear" aria-label="Suche löschen" hidden>✕</button>
  </div>
  <nav id="chips" aria-label="Kategorien"></nav>
</header>

<main id="grid"></main>
<p id="status"></p>

<div id="detail" hidden></div>
<div id="editor" hidden></div>
<div id="toast" hidden></div>

<script src="editor.js"></script>
<script>
// Cache-Buster: app.js wird IMMER neu vom Server geladen, nie vom Cache
// Das ist KRITISCH für Updates - ohne das bleiben alte Versionen gecacht
const cacheBuster = '?t=' + Date.now() + '&v=' + Math.random();
const script = document.createElement('script');
script.src = 'app.js' + cacheBuster;
document.body.appendChild(script);
</script>
</body>
</html>
