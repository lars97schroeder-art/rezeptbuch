<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Schrödamskis Schlemmerliste</title>
<meta name="theme-color" content="#F8F4EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161210" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest?v=20260707">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Schlemmerliste">
<link rel="preload" href="fonts/fraunces-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css?v=20261124-1">
<script>
// Version-Check: entfernt kaputte oder uralte Rezeptdaten VOR app.js.
// WICHTIG: NIEMALS localStorage.clear() — das würde den GitHub-Token und
// die Wochenplan-Einträge mitlöschen. Nur gezielt rezeptbuch-data anfassen.
console.log('🔍 Version-Check startet...');
if (typeof localStorage !== 'undefined') {
  try {
    const stored = localStorage.getItem('rezeptbuch-data');
    if (stored) {
      try {
        const data = JSON.parse(stored);
        const localVer = parseFloat(data.version);
        if (localVer < 3.3) {
          console.warn('⚠️ Alte Datenversion erkannt:', localVer, '– Rezeptdaten werden neu geladen');
          localStorage.removeItem('rezeptbuch-data');
        }
      } catch (parseErr) {
        console.error('❌ Rezeptdaten defekt – werden neu geladen:', parseErr);
        localStorage.removeItem('rezeptbuch-data');
      }
    }
  } catch (e) {
    console.error('❌ Version-Check fehlgeschlagen (Storage nicht verfügbar?):', e);
  }
}
console.log('✅ Version-Check abgeschlossen');
</script>
</head>
<body>
<!-- Schmale Zone am linken Rand: touch-action:none verhindert, dass Safari
     den Wisch als eigene Vor/Zurück-Browsergeste erkennt, bevor unser
     Wisch-Handler (nach rechts = Einstellungen bzw. Zurück) greift. -->
<div id="edge-swipe-guard" aria-hidden="true"></div>
<header>
  <div class="topbar">
    <h1>
      <span class="h1-text">Schrödamskis Schlemmerliste</span>
      <span class="h1-emoji">👨🏻‍🍳👩🏼‍🍳</span>
    </h1>
    <div class="actions">
      <button id="mode-btn" aria-label="Bereich wechseln" class="btn-pill"></button>
      <button id="btn-settings" title="Einstellungen" aria-label="Einstellungen" class="btn-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
      </button>
    </div>
  </div>
  <div id="mode-menu" hidden></div>
  <div class="shortcuts-row" id="shortcuts-row">
    <button id="btn-weekplan" title="Wochenplan" aria-label="Wochenplan" class="weekplan-shortcut">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
      <span class="weekplan-shortcut-label">Wochenplan</span>
    </button>
    <button id="btn-tinder" title="Food Match" aria-label="Food Match" class="weekplan-shortcut">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.7c0 5.6-7.5 10.2-7.5 10.2z"/></svg>
      <span class="weekplan-shortcut-label">Food Match</span>
    </button>
  </div>
  <div class="search-wrapper">
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
    <input id="search" type="search" placeholder="Rezept oder Zutat suchen" autocomplete="off">
    <button id="search-clear" class="search-clear" aria-label="Suche löschen" hidden>✕</button>
  </div>
  <div class="chips-row">
    <nav id="chips" aria-label="Kategorien"></nav>
    <div class="sort-wrap">
      <button id="sort-btn" aria-label="Sortieren" title="Sortieren">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5v14M8 5L4.5 8.5M8 5l3.5 3.5M16 19V5M16 19l-3.5-3.5M16 19l3.5-3.5"/></svg>
      </button>
      <div id="sort-menu" hidden></div>
    </div>
  </div>
</header>

<main id="grid"></main>
<p id="status"></p>

<div id="detail" hidden></div>
<div id="editor" hidden></div>
<div id="toast" hidden></div>

<script src="editor.js?v=20261124-1"></script>
<script>
// Cache-Buster: app.js wird IMMER neu vom Server geladen, nie vom Cache
// Das ist KRITISCH für Updates - ohne das bleiben alte Versionen gecacht
const cacheBuster = '?t=' + Date.now() + '&v=' + Math.random();
const script = document.createElement('script');
script.src = 'app.js' + cacheBuster;
document.body.appendChild(script);
</script>
</body>
</html>
